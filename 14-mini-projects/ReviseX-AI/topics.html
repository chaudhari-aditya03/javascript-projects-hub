<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topics - ReviseX AI</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    
    <!-- Navigation Bar -->
    <nav class="bg-white dark:bg-gray-800 shadow-lg fixed w-full top-0 z-50 transition-colors duration-300">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <a href="index.html" class="flex items-center space-x-3">
                        <i class="fas fa-graduation-cap text-blue-600 text-3xl"></i>
                        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">ReviseX AI</h1>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="darkModeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                        <i class="fas fa-moon text-gray-700 dark:text-yellow-400"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Breadcrumb Navigation -->
    <div class="container mx-auto px-4 pt-24 pb-4">
        <nav aria-label="breadcrumb">
            <ol class="flex space-x-2 text-gray-600 dark:text-gray-400">
                <li><a href="index.html" class="hover:text-blue-600">Home</a></li>
                <li><i class="fas fa-chevron-right text-xs mx-2"></i></li>
                <li><a href="dashboard.html" class="hover:text-blue-600">Subjects</a></li>
                <li><i class="fas fa-chevron-right text-xs mx-2"></i></li>
                <li id="subjectBreadcrumb" class="text-blue-600 font-semibold">...</li>
            </ol>
        </nav>
    </div>

    <!-- Subject Header -->
    <section class="py-8 px-4">
        <div class="container mx-auto">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center space-x-4">
                    <div id="subjectIcon" class="w-16 h-16 bg-gradient-to-br from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center text-white text-3xl">
                    </div>
                    <div>
                        <h2 id="subjectTitle" class="text-4xl font-bold text-gray-900 dark:text-white">...</h2>
                        <p id="subjectDescription" class="text-gray-600 dark:text-gray-300 mt-1">...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Category Tabs -->
    <section class="px-4 pb-8">
        <div class="container mx-auto">
            <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-2">
                <div class="flex flex-wrap gap-2" id="categoryTabs">
                    <!-- Category tabs will be dynamically loaded -->
                </div>
            </div>
        </div>
    </section>

    <!-- Topics Grid -->
    <section class="pb-20 px-4">
        <div class="container mx-auto">
            <div id="topicsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Topic cards will be dynamically loaded here -->
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="text-center py-20">
                <div class="spinner-border text-blue-600" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-4 text-gray-600 dark:text-gray-400">Loading topics...</p>
            </div>
        </div>
    </section>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-20 right-4 z-50 space-y-2"></div>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-8 transition-colors duration-300">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-600 dark:text-gray-400">
                &copy; 2026 ReviseX AI. Powered by Advanced AI Technology.
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script type="module" src="js/topics.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
